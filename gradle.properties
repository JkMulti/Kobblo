# Settings for every Gradle build of this project.

# The build's own memory. Compiling the app and shrinking a release both need most of this.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8

# Reuses the result of the configuration phase when no build script has changed.
org.gradle.configuration-cache=true

kotlin.code.style=official

# Many libraries' keep rules were written for ProGuard, which kept a class's default constructor along with
# the class. R8's full mode doesn't, and WorkManager's Room database then couldn't be created, so the app
# crashed on launch. Compatibility mode is a little larger, and much safer for connectors we can't run here.
android.enableR8.fullMode=false
